name: engine
on:
  push:
    paths: ['packages/engine/**', 'packages/content/**', 'packages/params/**', 'tools/ci/**', 'tools/dmath-ref/**', 'scripts/engine-check.mjs', '.github/workflows/engine.yml']
  pull_request:
    paths: ['packages/engine/**', 'packages/content/**', 'packages/params/**', 'tools/ci/**', 'tools/dmath-ref/**', 'scripts/engine-check.mjs', '.github/workflows/engine.yml']
  schedule:
    - cron: '0 2 * * *' # nightly: long runs (TYCOON_LONG=1)
  workflow_dispatch:
    inputs:
      long:
        description: 'Run the long tests (TYCOON_LONG=1: 03#39 2688 days, test 12 1344 days)'
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # long runs (nightly / dispatch long=true); the short suite takes ~2 min
    strategy:
      fail-fast: false
      matrix:
        pkg: [core, ledger, macro, content, params]
    env:
      TYCOON_LONG: ${{ (github.event_name == 'schedule' || inputs.long) && '1' || '' }}
      # long runs hold the committed entry log in memory (~2.5 MB per game day, by design): give the heap room
      NODE_OPTIONS: ${{ (github.event_name == 'schedule' || inputs.long) && '--max-old-space-size=8192' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: typecheck, lint, test (skipped when the package is absent)
        run: node scripts/engine-check.mjs ${{ matrix.pkg }}
      # E-81 AC-03-ER81-CANONICAL, enforced by CI (QA F-2: nothing ran the generator, so "regeneration is a
      # no-op" and the repo-relative header were kept true by hand only). A stale src/*-data.ts or a
      # machine-specific header path turns this step red.
      - name: generated catalog is a no-op (E-81)
        if: matrix.pkg == 'ledger'
        run: |
          node packages/engine/ledger/scripts/gen-catalog.mjs
          git diff --exit-code -- packages/engine/ledger/src/catalog-data.ts packages/engine/ledger/src/legpolicy-data.ts packages/engine/ledger/src/cppolicy-data.ts packages/engine/ledger/data/cppolicy.csv
