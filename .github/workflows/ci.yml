name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:paths -- origin/${{ github.base_ref }}
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'v3/quay-shell')
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
  # BUILD-ORDER.md is generated by export/build-plan/tools/order.py, and nothing ran that generator
  # (E-81's defect, one file over): a dropped dependency edge in any of the 401 cards left the plan
  # stale and every check green. This job regenerates and compares. It is a comparator, not a
  # validator -- assemble.py --check never opens the pack it validates, so it passes on a mutated
  # card. `git diff --exit-code` reads the committed bytes, so it bites on a stale card AND on a
  # hand-edited table. Lives in ci.yml (no `paths:` filter) rather than engine.yml (engine paths
  # only) because a card edit must trigger it.
  build-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The dev box runs `py` (3.13.11, has PyYAML); 3.14.9 does not ship it. There is no `py` on an
      # ubuntu runner, so pin the interpreter here and install PyYAML explicitly instead of
      # assuming the image has it -- a missing yaml must go red, not skip the check.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install --quiet 'PyYAML==6.0.2'
      - name: BUILD-ORDER.md matches a fresh generation
        run: |
          python3 export/build-plan/tools/order.py
          git diff --exit-code -- export/build-plan/BUILD-ORDER.md || {
            echo '::error file=export/build-plan/BUILD-ORDER.md::BUILD-ORDER.md is stale. Regenerate it: py export/build-plan/tools/order.py'
            git diff -- export/build-plan/BUILD-ORDER.md
            exit 1
          }
  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/shell
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
